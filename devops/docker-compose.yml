version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: nutriflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nutriflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nutriflow-net

  # Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: nutriflow-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - nutriflow-net

  # FastAPI Backend Service
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nutriflow-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nutriflow_db
      SECRET_KEY: nutriflow_production_secret_key_change_me
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - nutriflow-net

  # Nginx Frontend Service
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nutriflow-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nutriflow-net

volumes:
  postgres_data:
    driver: local

networks:
  nutriflow-net:
    driver: bridge
